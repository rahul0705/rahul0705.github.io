---
name: 'Setup Project'
description: 'Checkouts code, setups Node.js, and installs dependencies'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6 # zizmor: ignore[unpinned-uses]
      with:
        node-version: lts/*
        cache: npm

    - run: npm ci
      shell: bash
