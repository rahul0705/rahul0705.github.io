---
name: 'Setup Project'
description: 'Checkouts code, setups Node.js, and installs dependencies'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6 # zizmor: ignore[unpinned-uses]
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash
