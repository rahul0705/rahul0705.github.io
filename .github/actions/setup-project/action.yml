---
name: 'Setup Project Dependencies'
description: 'Sets up the project runtime and installs dependencies'

runs:
  using: 'composite'

  steps:
    - name: Setup runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash
