---
name: Security Analysis

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

  schedule:
    - cron: '17 5 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Analyze (${{ matrix.language }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        language:
          - actions
          - javascript-typescript

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # zizmor: ignore[unpinned-uses]
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'javascript-typescript' && 'manual' || 'none' }}
          queries: security-extended,security-and-quality

      - name: Setup project
        if: matrix.language == 'javascript-typescript'
        uses: ./.github/actions/setup-project

      - name: Build project
        if: matrix.language == 'javascript-typescript'
        run: npm run build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4 # zizmor: ignore[unpinned-uses]
