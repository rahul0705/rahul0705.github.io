---
name: Security Analysis

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

  schedule:
    - cron: '17 5 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-analysis:
    name: Analyze (${{ matrix.language }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # zizmor: ignore[unpinned-uses]
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4 # zizmor: ignore[unpinned-uses]

  dependency-review:
    name: Review Dependencies

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]

      - name: Review dependencies
        uses: actions/dependency-review-action@v4 # zizmor: ignore[unpinned-uses]
        with:
          fail-on-severity: high
