---
name: Format CMS content

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - 'cms/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout latest content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project

      - name: Format content using repository policy
        run: npm run format:fix -- src/content

      - name: Commit formatting and start validation
        env:
          GH_TOKEN: ${{ github.token }}
          CMS_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/content; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- src/content
            git commit -m 'style(content): format CMS changes'
            gh auth setup-git
            git push origin "HEAD:refs/heads/$CMS_BRANCH"
            # GITHUB_TOKEN pushes do not trigger push workflows; validate the new branch head explicitly.
            gh workflow run project.yml --ref "$CMS_BRANCH"
          fi
