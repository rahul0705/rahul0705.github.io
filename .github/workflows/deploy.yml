---
name: Build and Deploy Astro Site to GitHub Pages

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - '**' # Runs on all pushes
  pull_request:
    branches:
      - '**' # Runs on all pull requests
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - name: Install, build, and upload your site
        uses: withastro/action@v6 # zizmor: ignore[unpinned-uses]

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # zizmor: ignore[unpinned-uses]
