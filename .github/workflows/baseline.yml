---
name: Project Continuous Integration

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Check formatting
        run: npm run format

  lint-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Lint code
        run: npm run lint:code

  lint-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Lint styling
        run: npm run lint:css

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Spellcheck
        run: npm run spellcheck

  build:
    needs:
      - format
      - lint-code
      - lint-css
      - spellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Build project
        run: npm run build
