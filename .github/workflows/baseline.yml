---
name: Baseline Continuous Integration

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6 # zizmor: ignore[unpinned-uses]
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run format

  lint-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6 # zizmor: ignore[unpinned-uses]
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint:code

  lint-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6 # zizmor: ignore[unpinned-uses]
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint:css

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6 # zizmor: ignore[unpinned-uses]
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run spellcheck
