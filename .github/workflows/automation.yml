---
name: Repository Automation Validation

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
  push:
    branches:
      - '**'
    paths:
      - '.github/**'

permissions: {}

jobs:
  security:
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: Scan workflows
        uses: zizmorcore/zizmor-action@v0.6.0 # zizmor: ignore[unpinned-uses]

  syntax:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: Validate workflows
        uses: raven-actions/actionlint@v2 # zizmor: ignore[unpinned-uses]
