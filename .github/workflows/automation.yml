---
name: Repository Automation Validation

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
  push:
    branches:
      - main
    paths:
      - '.github/**'
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Workflow security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan workflows
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: true
          collect: all

  syntax:
    name: Workflow syntax
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  automation:
    name: Automation
    needs: [security, syntax]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Summarize automation checks
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          SYNTAX_RESULT: ${{ needs.syntax.result }}
        run: |
          {
            echo '## Automation validation'
            echo
            echo "- Workflow security: $SECURITY_RESULT"
            echo "- Workflow syntax: $SYNTAX_RESULT"
            echo
            echo 'Inspect failed job logs and the repository Security tab for details.'
            echo 'Security findings are advisory; this result does not gate the site build.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SECURITY_RESULT" != 'success' || "$SYNTAX_RESULT" != 'success' ]]; then
            echo '::error title=Automation validation failed::Workflow security and syntax checks must both pass.'
            exit 1
          fi
