---
name: Repository Automation Validation

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
  push:
    branches:
      - main
    paths:
      - '.github/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan workflows
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1

  syntax:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  report:
    name: Report results

    needs:
      - security
      - syntax

    if: always() && github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for reporting code
        id: reporter
        run: |
          if test -f .github/scripts/pr-check-report.ts; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Update pull request check report
        if: steps.reporter.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const reportUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-check-report.ts`);
            const { default: report } = await import(reportUrl.href);
            await report({ github, context, core });
