---
name: Pull Request Check Report

on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows:
      - Project Continuous Integration and Deployment
      - Repository Automation Validation
      - Security Analysis
    types:
      - completed

permissions: {}

concurrency:
  group: pr-check-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Update pull request check report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const reportUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-check-report.ts`);
            const { default: report } = await import(reportUrl.href);
            await report({ github, context, core });
