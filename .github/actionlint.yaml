paths:
  .github/workflows/project.yml:
    ignore:
      # GitHub recommends $/ for same-repository actions, but Actionlint 1.7.12 does not recognize it yet.
      - 'specifying action "\$/\.github/actions/setup-project" in invalid format because ref is missing'
  .github/workflows/format-cms.yml:
    ignore:
      # Same-repository references are supported by GitHub but not yet recognized by Actionlint.
      - 'specifying action "\$/\.github/actions/setup-project" in invalid format because ref is missing'
